[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rampflow-ground-ops"
version = "1.0.0"
description = "Airport ground operations, turnaround coordination and disruption analysis"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rampflow = "rampflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
